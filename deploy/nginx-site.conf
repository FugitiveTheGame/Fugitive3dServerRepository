# repository.fugitivethegame.online — reverse proxy to the server repository.
# Installed by install.sh as
# /etc/nginx/sites-available/repository.fugitivethegame.online.
#
# Plain HTTP on purpose, and the only vhost on this box that should stay that
# way. Shipped game clients hardcode
#   http://repository.fugitivethegame.online
# and cannot be updated, so do NOT let `certbot --nginx` add an unconditional
# `return 301 https://...` here; it would break the in-game server browser for
# every client already in players' hands. If TLS is wanted later, add a 443
# block and leave port 80 answering directly.

server {
	listen 80;
	listen [::]:80;
	server_name repository.fugitivethegame.online;

	include snippets/fugitive-repo-deploy.conf;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;

		# Load-bearing, not boilerplate. The service authenticates game servers
		# by source IP and believes this header only from loopback. Without it
		# every registration is compared against 127.0.0.1 and rejected with a
		# 403, while GET /servers keeps answering — so the service looks
		# healthy from outside while the browser stays permanently empty.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Registration dials the game server back over UDP and waits up to five
		# seconds for a reply before answering.
		proxy_read_timeout 30s;
	}

	access_log /var/log/nginx/repository.fugitivethegame.online.access.log;
	error_log  /var/log/nginx/repository.fugitivethegame.online.error.log;
}
