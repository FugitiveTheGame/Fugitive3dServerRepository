name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file tracks the go directive, so the toolchain follows
      # go.mod instead of drifting from it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The race detector is the reason this job runs on Linux: it needs cgo
      # and a C compiler, which the repository's usual Windows development
      # machine does not have. The repository's concurrency tests are only
      # meaningful under -race.
      - name: test
        run: go test -race -count=1 ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately not go-version-file here. The go directive is a floor, so
      # it pins the oldest patch release of that minor version, and govulncheck
      # reports the toolchain's own standard library: scanning against the floor
      # reports stdlib CVEs that were fixed in later patches. Scan with a current
      # toolchain, which is what releases should be built with.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # Reports only vulnerabilities this code actually reaches, so an
      # advisory in an unused corner of a dependency does not fail the build.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
